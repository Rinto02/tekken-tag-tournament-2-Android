name: generate-ppc

# Generates re/ppc (the recompiled game code) from YOUR game files.
#
# This repository is public, so the game files and the generated code must never be stored
# here, attached as artifacts or printed in logs (artifacts and logs of a public repository
# are public). They live in a PRIVATE repository instead:
#
#   secret   GAME_FILES_TOKEN   a personal access token with read/write ("Contents") access to that repo
#   variable GAME_FILES_REPO    owner/name of the private repo, e.g. Rinto02/ttt2-private
#
# The private repo holds Default.xex and the Title Update 3 package. The result is uploaded
# to that repo as a release asset (ppc-<run number>), never to this one.

on:
  workflow_dispatch:

jobs:
  recompiler:
    name: Build XenonRecomp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake
      - name: Fetch XenonRecomp (pinned)
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp tools/XenonRecomp
          git -C tools/XenonRecomp checkout ddd128bcca99fe8bfbb99bea583c972351fa6ace
          git -C tools/XenonRecomp submodule update --init --recursive
          git -C tools/XenonRecomp apply --ignore-whitespace --whitespace=nowarn "$GITHUB_WORKSPACE/tools/patches/XenonRecomp.patch"
      - name: Build
        run: |
          cmake -S tools/XenonRecomp -B tools/XenonRecomp/build -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/XenonRecomp/build
          ls tools/XenonRecomp/build/XenonRecomp/XenonRecomp
      - name: Package recompiler
        run: |
          mkdir pack
          cp tools/XenonRecomp/build/XenonRecomp/XenonRecomp pack/
          cp tools/XenonRecomp/XenonUtils/ppc_context.h pack/
      - uses: actions/upload-artifact@v4
        with:
          name: xenonrecomp   # the recompiler only: no game data
          path: pack
          retention-days: 3

  generate:
    name: Generate re/ppc
    needs: recompiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
          REPO: ${{ vars.GAME_FILES_REPO }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REPO" ]; then
            echo "Set the GAME_FILES_TOKEN secret and the GAME_FILES_REPO variable (see the comment at the top of this workflow)." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: xenonrecomp
          path: recompiler
      - name: Fetch your game files (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GAME_FILES_REPO }}
          token: ${{ secrets.GAME_FILES_TOKEN }}
          path: gamefiles
      - name: Install Python deps
        run: pip install pycryptodome
      - name: Generate
        run: |
          chmod +x recompiler/XenonRecomp
          python3 port/tools/generate_ppc.py \
            --game-dir gamefiles \
            --recompiler "$PWD/recompiler/XenonRecomp" \
            --ppc-context "$PWD/recompiler/ppc_context.h"
      - name: Package (stays private)
        run: |
          tar --zstd -cf ppc.tar.zst re/ppc port/src/runtime/kernel_stubs.gen.cpp re/recomp/tekken.toml
          ls -lh ppc.tar.zst
      - name: Upload to the private repo
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          gh release create "ppc-${{ github.run_number }}" ppc.tar.zst \
            --repo "${{ vars.GAME_FILES_REPO }}" \
            --title "Generated re/ppc (run ${{ github.run_number }})" \
            --notes "Generated by generate-ppc from the files in this repo. Do not publish."
